name: Release 3X-UI

on:
  workflow_dispatch:
  # Only main (dev channel) and version tags ship binaries; build any other
  # branch on demand via workflow_dispatch.
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "**.sh"
      - "frontend/**"
      - "x-ui.service.debian"
      - "x-ui.service.arch"
      - "x-ui.service.rhel"
      - ".github/workflows/release.yml"

permissions:
  contents: read

env:
  BOOTLIN_VERSION: 2026.08-1

jobs:
  resolve-xray-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Resolve latest custom Xray release
        id: resolve
        run: echo "version=$(./tools/latest-xray-feat-version.sh)" >> "$GITHUB_OUTPUT"
      - name: Wait for custom Xray release assets
        env:
          XRAY_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          assets=(
            Xray-linux-64.zip
            Xray-linux-arm64-v8a.zip
            Xray-linux-arm32-v7a.zip
            Xray-linux-arm32-v6.zip
            Xray-linux-32.zip
            Xray-linux-arm32-v5.zip
            Xray-linux-s390x.zip
            Xray-windows-64.zip
          )
          release_url="https://github.com/Rain-kl/Xray-core/releases/download/${XRAY_VERSION}"
          deadline=$((SECONDS + 1200))
          while true; do
            missing=()
            for asset in "${assets[@]}"; do
              if ! curl --fail --silent --show-error --location --head --max-time 30 "${release_url}/${asset}" >/dev/null; then
                missing+=("$asset")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for custom Xray assets: ${missing[*]}" >&2
              exit 1
            fi
            echo "Waiting for custom Xray assets: ${missing[*]}"
            sleep 15
          done

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify panel frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm lint
          pnpm test --project unit
          pnpm run build
      - name: Share verified frontend bundle
        uses: actions/upload-artifact@v7
        with:
          name: panel-frontend
          path: internal/web/dist/
          include-hidden-files: true
          retention-days: 1

  validate-core:
    strategy:
      fail-fast: false
      matrix:
        check: [integration, race]
    needs: resolve-xray-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: modules-${{ runner.os }}-
      - name: Cache Go compilation
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: compile-${{ runner.os }}-${{ runner.arch }}-native-${{ matrix.check }}-gcc-${{ hashFiles('go.mod') }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-${{ runner.os }}-${{ runner.arch }}-native-${{ matrix.check }}-gcc-${{ hashFiles('go.mod') }}-${{ hashFiles('go.mod', 'go.sum') }}-
            compile-${{ runner.os }}-${{ runner.arch }}-native-${{ matrix.check }}-gcc-${{ hashFiles('go.mod') }}-
      - name: Download and verify selected custom core
        env:
          XRAY_VERSION: ${{ needs.resolve-xray-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/validated-xray
          cd /tmp/validated-xray
          base="https://github.com/Rain-kl/Xray-core/releases/download/${XRAY_VERSION}"
          curl -fSL --retry 3 "$base/Xray-linux-64.zip" -o Xray-linux-64.zip
          curl -fSL --retry 3 "$base/Xray-linux-64.zip.dgst" -o Xray-linux-64.zip.dgst
          digest=$(awk '$1 == "SHA2-256=" {print $2}' Xray-linux-64.zip.dgst)
          test "${#digest}" -eq 64
          echo "$digest  Xray-linux-64.zip" | sha256sum -c -
          unzip -q Xray-linux-64.zip
          chmod +x xray
          actual=$(./xray version | awk 'NR==1 {print "v" $2}')
          test "$actual" = "$XRAY_VERSION"
      - name: Verify selected binary audit, domains and rate limits
        if: matrix.check == 'integration'
        env:
          XRAY_TRAFFICLOG_BIN: /tmp/validated-xray/xray
        run: go test github.com/xtls/xray-core/testing/trafficlog -count=1
      - name: Verify panel audit and real core API integration
        if: matrix.check == 'integration'
        env:
          XRAY_E2E_BINARY: /tmp/validated-xray/xray
        run: |
          make dist-stub
          go test ./internal/audit ./internal/xray ./internal/web/service ./internal/database ./internal/web/controller ./internal/web/job ./internal/web/runtime -count=1
          go test ./internal/web -run 'Test(MasterNodeContract|RouteRegistryContract)' -count=1
      - name: Verify audit and node races
        if: matrix.check == 'race'
        env:
          XRAY_E2E_BINARY: /tmp/validated-xray/xray
        run: |
          make dist-stub
          go test -race ./internal/audit -count=1
          go test -race ./internal/web/service -run 'Test(Audit|SetAudit|Node)' -count=1 -timeout 25m

  build:
    needs: [resolve-xray-version, frontend]
    strategy:
      # One platform hitting a transient outage must not cancel the other six.
      fail-fast: false
      matrix:
        platform:
          - amd64
          - arm64
          - armv7
          - armv6
          - 386
          - armv5
          - s390x
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: modules-${{ runner.os }}-
      - name: Cache Go compilation
        uses: actions/cache@v5
        with:
          path: ~/.cache/go-build
          key: compile-${{ runner.os }}-${{ runner.arch }}-linux-${{ matrix.platform }}-bootlin-${{ env.BOOTLIN_VERSION }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-${{ runner.os }}-${{ runner.arch }}-linux-${{ matrix.platform }}-bootlin-${{ env.BOOTLIN_VERSION }}-${{ hashFiles('go.mod') }}-${{ hashFiles('go.mod', 'go.sum') }}-
            compile-${{ runner.os }}-${{ runner.arch }}-linux-${{ matrix.platform }}-bootlin-${{ env.BOOTLIN_VERSION }}-${{ hashFiles('go.mod') }}-

      - name: Download verified frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: panel-frontend
          path: internal/web/dist

      - name: Cache Bootlin toolchain
        uses: actions/cache@v5
        with:
          path: /tmp/xui-bootlin
          key: bootlin-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.BOOTLIN_VERSION }}

      - name: Build 3X-UI
        run: |
          CURL_RETRY="--retry 5 --retry-all-errors --retry-delay 3"
          fetch() { wget --tries=10 --waitretry=10 --retry-on-http-error=404,429,500,502,503 "$@"; }
          export CGO_ENABLED=1
          export GOOS=linux
          export GOARCH=${{ matrix.platform }}
          # Use Bootlin prebuilt cross-toolchains (musl 1.2.5 in stable series)
          case "${{ matrix.platform }}" in
            amd64) BOOTLIN_ARCH="x86-64" ;;
            arm64) BOOTLIN_ARCH="aarch64" ;;
            armv7) BOOTLIN_ARCH="armv7-eabihf"; export GOARCH=arm GOARM=7 ;;
            armv6) BOOTLIN_ARCH="armv6-eabihf"; export GOARCH=arm GOARM=6 ;;
            armv5) BOOTLIN_ARCH="armv5-eabi"; export GOARCH=arm GOARM=5 ;;
            386) BOOTLIN_ARCH="x86-i686" ;;
            s390x) BOOTLIN_ARCH="s390x-z13" ;;
          esac
          TOOLCHAIN_DIR="/tmp/xui-bootlin/${BOOTLIN_ARCH}--musl--stable-${BOOTLIN_VERSION}"
          if [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            TARBALL="${BOOTLIN_ARCH}--musl--stable-${BOOTLIN_VERSION}.tar.xz"
            mkdir -p /tmp/xui-bootlin
            curl -fL -sS $CURL_RETRY -o /tmp/bootlin.tar.xz "https://toolchains.bootlin.com/downloads/releases/toolchains/$BOOTLIN_ARCH/tarballs/$TARBALL"
            tar -xf /tmp/bootlin.tar.xz -C /tmp/xui-bootlin
          fi
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          CC=$(find "$TOOLCHAIN_DIR/bin" -name '*-gcc.br_real' -type f -executable -print -quit)
          [ -n "$CC" ] || { echo "No gcc.br_real found in $TOOLCHAIN_DIR/bin" >&2; exit 1; }
          export CC
          # Stamp the commit into per-commit (dev channel) builds only; tagged
          # stable releases stay unstamped so config.IsDevBuild() returns false.
          LDFLAGS="-w -s -linkmode external -extldflags '-static'"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA::8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -buildvcs=true -ldflags "$LDFLAGS" -o xui-release -v .
          file xui-release
          ldd xui-release || echo "Static binary confirmed"

          mkdir x-ui
          cp xui-release x-ui/
          cp x-ui.service.debian x-ui/
          cp x-ui.service.arch x-ui/
          cp x-ui.service.rhel x-ui/
          cp x-ui.sh x-ui/
          mv x-ui/xui-release x-ui/x-ui
          mkdir x-ui/bin
          cd x-ui/bin

          # Download dependencies
          Xray_URL="https://github.com/Rain-kl/Xray-core/releases/download/${{ needs.resolve-xray-version.outputs.version }}/"
          case "${{ matrix.platform }}" in
            amd64) XRAY_ASSET=Xray-linux-64.zip ;;
            arm64) XRAY_ASSET=Xray-linux-arm64-v8a.zip ;;
            armv7) XRAY_ASSET=Xray-linux-arm32-v7a.zip ;;
            armv6) XRAY_ASSET=Xray-linux-arm32-v6.zip ;;
            386) XRAY_ASSET=Xray-linux-32.zip ;;
            armv5) XRAY_ASSET=Xray-linux-arm32-v5.zip ;;
            s390x) XRAY_ASSET=Xray-linux-s390x.zip ;;
            *) echo "Unsupported core platform" >&2; exit 1 ;;
          esac
          fetch "${Xray_URL}${XRAY_ASSET}"
          fetch "${Xray_URL}${XRAY_ASSET}.dgst"
          digest=$(awk '$1 == "SHA2-256=" {print $2}' "${XRAY_ASSET}.dgst")
          [[ "$digest" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Missing core SHA256" >&2; exit 1; }
          echo "$digest  $XRAY_ASSET" | sha256sum --check --strict
          unzip "$XRAY_ASSET"
          test -s xray
          rm -f "$XRAY_ASSET" "${XRAY_ASSET}.dgst"
          rm -f geoip.dat geosite.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          fetch -O geoip_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat
          fetch -O geosite_IR.dat https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat
          fetch -O geoip_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat
          fetch -O geosite_RU.dat https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-${{ matrix.platform }}
          # mtg-multi (MTProto sidecar) ships prebuilt release binaries whose
          # platform labels match our matrix, so download and unpack the matching
          # archive. Only the platforms the fork publishes are packaged — the tag
          # lookup lives inside that branch so unpackaged platforms (s390x) never
          # depend on it. The tag comes from the release-page redirect on
          # github.com — the host the downloads need anyway — because api.github.com
          # has 503'd whole release runs while asset downloads kept working.
          case "${{ matrix.platform }}" in
            amd64|arm64|armv7|armv6|386)
              MTG_MULTI_VER=$(curl -sf $CURL_RETRY -o /dev/null -w '%{redirect_url}' "https://github.com/mhsanaei/mtg-multi/releases/latest" | sed -n 's#.*/releases/tag/##p')
              if [ -z "$MTG_MULTI_VER" ]; then echo "could not resolve the latest mtg-multi release tag"; exit 1; fi
              MTG_PKG="mtg-multi-${MTG_MULTI_VER#v}-linux-${{ matrix.platform }}"
              curl -sfLRO $CURL_RETRY "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VER}/${MTG_PKG}.tar.gz"
              tar -xzf "${MTG_PKG}.tar.gz"
              mv "${MTG_PKG}/mtg-multi" "mtg-linux-${{ matrix.platform }}"
              rm -rf "${MTG_PKG}" "${MTG_PKG}.tar.gz"
              ;;
          esac
          cd ../..

      - name: Package
        run: |
          tar -I 'pigz -p 2' -cf x-ui-linux-${{ matrix.platform }}.tar.gz x-ui
          sha256sum x-ui-linux-${{ matrix.platform }}.tar.gz > x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: x-ui-linux-${{ matrix.platform }}
          path: |
            ./x-ui-linux-${{ matrix.platform }}.tar.gz
            ./x-ui-linux-${{ matrix.platform }}.tar.gz.sha256

  # =================================
  #  Windows Build
  # =================================
  build-windows:
    needs: [resolve-xray-version, frontend]
    name: Build for Windows
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        platform:
          - amd64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: modules-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: modules-${{ runner.os }}-
      - name: Cache Go compilation
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/go-build
          key: compile-${{ runner.os }}-${{ runner.arch }}-windows-amd64-mingw-${{ hashFiles('go.mod') }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            compile-${{ runner.os }}-${{ runner.arch }}-windows-amd64-mingw-${{ hashFiles('go.mod') }}-${{ hashFiles('go.mod', 'go.sum') }}-
            compile-${{ runner.os }}-${{ runner.arch }}-windows-amd64-mingw-${{ hashFiles('go.mod') }}-

      - name: Download verified frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: panel-frontend
          path: internal/web/dist

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-pkg-config

      - name: Build 3X-UI for Windows (CGO)
        shell: msys2 {0}
        run: |
          export PATH="/c/hostedtoolcache/windows/go/$(ls /c/hostedtoolcache/windows/go | sort -V | tail -n1)/x64/bin:$PATH"

          export CGO_ENABLED=1
          export GOOS=windows
          export GOARCH=amd64
          export CC=x86_64-w64-mingw32-gcc

          which go
          go version
          gcc --version

          # Stamp the commit into per-commit (dev channel) builds only.
          LDFLAGS="-w -s"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            LDFLAGS="$LDFLAGS -X github.com/mhsanaei/3x-ui/v3/internal/config.buildCommit=${GITHUB_SHA:0:8} -X github.com/mhsanaei/3x-ui/v3/internal/config.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          go build -buildvcs=true -ldflags "$LDFLAGS" -o xui-release.exe -v .

      - name: Copy and download resources
        shell: pwsh
        run: |
          $retry = @{ MaximumRetryCount = 5; RetryIntervalSec = 10 }
          mkdir x-ui
          Copy-Item xui-release.exe x-ui\x-ui.exe
          mkdir x-ui\bin
          cd x-ui\bin

          # Download Xray for Windows
          $Xray_URL = "https://github.com/Rain-kl/Xray-core/releases/download/${{ needs.resolve-xray-version.outputs.version }}/"
          Invoke-WebRequest @retry -Uri "${Xray_URL}Xray-windows-64.zip" -OutFile "Xray-windows-64.zip"
          Invoke-WebRequest @retry -Uri "${Xray_URL}Xray-windows-64.zip.dgst" -OutFile "Xray-windows-64.zip.dgst"
          $digestLine = Get-Content "Xray-windows-64.zip.dgst" | Where-Object { $_ -match '^SHA2-256=\s*[a-fA-F0-9]{64}$' }
          if (@($digestLine).Count -ne 1) { throw "Missing core SHA256" }
          $expected = ($digestLine -replace '^SHA2-256=\s*', '').Trim()
          if ((Get-FileHash "Xray-windows-64.zip" -Algorithm SHA256).Hash -ne $expected) { throw "Core checksum mismatch" }
          Expand-Archive -Path "Xray-windows-64.zip" -DestinationPath .
          if (-not (Test-Path "xray.exe")) { throw "Core executable missing" }
          Remove-Item "Xray-windows-64.zip.dgst"
          Remove-Item "Xray-windows-64.zip"
          Remove-Item geoip.dat, geosite.dat -ErrorAction SilentlyContinue
          Invoke-WebRequest @retry -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat" -OutFile "geoip_IR.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat" -OutFile "geosite_IR.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat" -OutFile "geoip_RU.dat"
          Invoke-WebRequest @retry -Uri "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat" -OutFile "geosite_RU.dat"
          Rename-Item xray.exe xray-windows-amd64.exe

          # mtg-multi (MTProto sidecar) publishes a prebuilt Windows binary, so
          # download and unpack it instead of compiling. The tag comes from the
          # release-page redirect on github.com — not api.github.com, whose
          # outages have failed release runs while asset downloads kept working.
          $MTG_MULTI_VER = (curl.exe -sf --retry 5 --retry-all-errors --retry-delay 3 -o NUL -w '%{redirect_url}' "https://github.com/mhsanaei/mtg-multi/releases/latest") -replace '^.*/releases/tag/', ''
          if (-not $MTG_MULTI_VER -or $MTG_MULTI_VER -notmatch '^v[\d.]+$') { throw "could not resolve the latest mtg-multi release tag" }
          $MTG_PKG = "mtg-multi-$($MTG_MULTI_VER.TrimStart('v'))-windows-amd64"
          curl.exe -sfLRO --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/mhsanaei/mtg-multi/releases/download/$MTG_MULTI_VER/$MTG_PKG.zip"
          Expand-Archive -Path "$MTG_PKG.zip" -DestinationPath "mtg-tmp" -Force
          Move-Item "mtg-tmp/$MTG_PKG/mtg-multi.exe" "mtg-windows-amd64.exe"
          Remove-Item -Recurse -Force "mtg-tmp", "$MTG_PKG.zip"

          cd ..
          Copy-Item -Path ..\windows_files\* -Destination . -Recurse
          cd ..

      - name: Package to Zip
        shell: pwsh
        run: |
          Compress-Archive -Path .\x-ui -DestinationPath "x-ui-windows-amd64.zip"
          $hash = (Get-FileHash x-ui-windows-amd64.zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\x-ui-windows-amd64.zip.sha256", "$hash  x-ui-windows-amd64.zip`n")

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: x-ui-windows-amd64
          path: |
            ./x-ui-windows-amd64.zip
            ./x-ui-windows-amd64.zip.sha256

  # =================================
  #  Rolling dev channel (per-commit)
  # =================================
  # Publishes/overwrites the build artifacts to a single fixed-tag pre-release
  # `dev-latest`, force-moved to the new commit on every push to main. The panel's
  # "Dev" update channel installs from this tag. `--latest=false` is load-bearing:
  # it keeps releases/latest pointing at the real stable tag, so the stable
  # channel is unaffected.
  publish-dev:
    name: Publish rolling dev release
    needs: [build, validate-core]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialize racing pushes; never cancel an in-flight upload, or the dev
    # release could be left with a partial asset set.
    concurrency:
      group: dev-release
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: x-ui-linux-*
          path: dev-artifacts
          merge-multiple: true

      - name: Publish dev-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "attempt $i failed: ${*:1:3}" >&2
              sleep $((i * 5))
            done
            return 1
          }
          short="${COMMIT::8}"
          notes="Rolling development build — installs via the panel's Dev update channel.

          commit=${COMMIT}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          Automated per-commit build from main. Not a stable release."

          # Force-move the dev-latest tag to this commit so the release tracks it.
          git tag -f dev-latest "${COMMIT}"
          retry git push -f origin refs/tags/dev-latest

          # The release exists on every run but the first; edit-first avoids an
          # existence probe that can 503 and mis-route into create (422).
          if ! retry gh release edit dev-latest --prerelease --latest=false \
              --title "Dev build ${short}" --notes "${notes}"; then
            retry gh release create dev-latest --prerelease --latest=false \
              --target "${COMMIT}" --title "Dev build ${short}" --notes "${notes}"
          fi

          # Ensure dev-latest does not retain legacy Windows assets.
          gh release delete-asset dev-latest x-ui-windows-amd64.zip -y 2>/dev/null || true
          gh release delete-asset dev-latest x-ui-windows-amd64.zip.sha256 -y 2>/dev/null || true

          retry gh release upload dev-latest dev-artifacts/*.tar.gz dev-artifacts/*.sha256 --clobber

  publish-tag:
    name: Publish versioned release
    needs: [build, build-windows, validate-core]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v8
        with:
          pattern: x-ui-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish verified packages
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: release-artifacts/*
          file_glob: true
          overwrite: true
          prerelease: true
